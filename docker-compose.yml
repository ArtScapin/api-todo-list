services:
  api-todo-list:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: on-failure
    environment:
      - AUTH_JWT_SECRET=dev-secret-change-me
      - AUTH_JWT_ISSUER=API TODO LIST
      - AUTH_JWT_ACCESS_TOKEN_EXPIRATION_HOURS=2
      - AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS=7
