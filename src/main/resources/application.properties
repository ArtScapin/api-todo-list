server.port=${PORT:8080}
server.servlet.context-path=/api-todo-list

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.issuer=${AUTH_JWT_ISSUER}
auth.jwt.access-token-expiration-hours=${AUTH_JWT_ACCESS_TOKEN_EXPIRATION_HOURS}
auth.jwt.refresh-token-expiration-days=${AUTH_JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
